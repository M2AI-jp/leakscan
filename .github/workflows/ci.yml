name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: データセットを検証
        run: node scripts/validate.mjs

      - name: 照合ロジックと誤検知のテスト
        run: node test/match.test.js

      - name: 生成物が最新か確認
        run: |
          node scripts/build.mjs
          if ! git diff --quiet -- data site/data extension/data; then
            echo "::error::生成物が古くなっています。'node scripts/build.mjs' を実行してコミットしてください。"
            git diff --stat -- data site/data extension/data
            exit 1
          fi

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs

      - name: デプロイ設定の有無を確認
        id: cfg
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN 未設定のためデプロイをスキップ（手動 'npx wrangler deploy' で公開できます）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare へデプロイ
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
