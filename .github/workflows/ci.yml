name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: データセットを検証
        run: node scripts/validate.mjs

      - name: 照合ロジックと誤検知のテスト
        run: node test/match.test.js

      - name: 生成物が最新か確認
        run: |
          node scripts/build.mjs
          if ! git diff --quiet -- data site/data extension/data; then
            echo "::error::生成物が古くなっています。'node scripts/build.mjs' を実行してコミットしてください。"
            git diff --stat -- data site/data extension/data
            exit 1
          fi
