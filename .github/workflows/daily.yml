name: Daily update

on:
  schedule:
    # GitHubの定時実行は「できれば動かす」扱いで、混雑時は遅れるか流れる。
    # 1日1回だけだと流れた日が丸ごと落ちるので、拾い直す窓を置いてある。
    # 2回目以降は、新しい事案が無ければ何も変わらず、コミットもしない。
    - cron: '0 23 * * *'   # 08:00 JST
    - cron: '0 2 * * *'    # 11:00 JST（8時の回が流れたとき）
    - cron: '0 6 * * *'    # 15:00 JST（それも流れたとき）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 情報源の更新を検出
        id: watch
        run: |
          node scripts/watch-sources.mjs | tee /tmp/watch.txt
          echo "changed=$(grep -c '^CHANGED' /tmp/watch.txt || true)" >> "$GITHUB_OUTPUT"

      - name: 出典リンクの生存確認
        id: links
        continue-on-error: true
        run: node scripts/check-sources.mjs | tee /tmp/links.txt

      - name: 未収録の事案を収集
        id: collect
        run: |
          node scripts/collect.mjs | tee /tmp/collect.txt
          echo "found=$(grep -c '^CAND' /tmp/collect.txt || true)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(grep -c '^SKIP' /tmp/collect.txt || true)" >> "$GITHUB_OUTPUT"

      - name: 事案を自動追記
        id: autoadd
        env:
          MAX_PER_RUN: '60'
          MAX_AGE_DAYS: '45'
        run: |
          node scripts/autoadd.mjs | tee /tmp/autoadd.txt
          echo "added=$(grep -oE '^[0-9]+ 件を自動追記' /tmp/autoadd.txt | grep -oE '^[0-9]+' || echo 0)" >> "$GITHUB_OUTPUT"

      - name: 既存の自動追記分を情報源と同期
        run: node scripts/refresh-auto.mjs

      - name: 照合ドメインを公式発表から補完
        id: resolve
        env:
          RESOLVE_LIMIT: '40'
        run: |
          node scripts/resolve-domains.mjs | tee /tmp/resolve.txt
          echo "resolved=$(grep -oE 'ドメインを補完: [0-9]+' /tmp/resolve.txt | grep -oE '[0-9]+' || echo 0)" >> "$GITHUB_OUTPUT"

      - name: データセットを検証して生成物を更新
        run: |
          node scripts/stamp.mjs
          node scripts/validate.mjs
          node scripts/build.mjs
          node test/match.test.js
          node test/domains.test.mjs
          node test/feed.test.mjs
          node test/db-mirror.test.mjs
          node test/sanitize.test.mjs
          node test/stamp.test.mjs
          node test/site-load.test.mjs

      - name: 検証に失敗したら自動追記を取り消す
        if: failure()
        run: |
          echo "::warning::検証に失敗したため自動追記を破棄します"
          git checkout -- data/breaches.json || true

      - name: 変更をコミット
        run: |
          git config user.name  "leakscan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "変更なし"
          else
            git add -A
            git commit -m "chore: 日次更新（事案 +${{ steps.autoadd.outputs.added }}件 / 情報源の状態 / 生成物）"
            git push
          fi

      - name: サイトへ反映
        id: deploy
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN が未設定のため、配信物は前回のデプロイのままです。サイトも拡張機能もGitHub側の新しいデータを読むので、追記した事案は利用者に届きます。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare へデプロイ
        if: steps.deploy.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 要確認のIssueを作成・更新
        if: steps.watch.outputs.changed != '0' || steps.collect.outputs.skipped != '0' || steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="要確認: 情報源の更新 / リンク切れ ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          {
            echo "日次ジョブが人の確認を必要とする変化を検出しました。"
            echo
            echo "> **重要**: 新しい事案の追加は必ず人間が公式発表を読んでから行ってください。"
            echo "> 自動抽出はしません（誤った企業名の公開を防ぐため）。"
            echo
            echo "## 自動追記"
            echo '```'
            cat /tmp/autoadd.txt 2>/dev/null | head -60 || echo "（なし）"
            echo '```'
            echo
            echo "## 更新された情報源"
            echo '```'
            grep -E '^(CHANGED|FAILED)' /tmp/watch.txt || echo "（なし）"
            echo '```'
            echo
            echo "## 出典リンクの生存確認"
            echo '```'
            tail -40 /tmp/links.txt 2>/dev/null || echo "（実行できませんでした）"
            echo '```'
            echo
            echo "## 手順"
            echo "1. 上記の情報源を開き、未収録の事案がないか確認する"
            echo "2. あれば各社の公式発表で件数・漏洩項目・公表日を確認する"
            echo "3. \`data/breaches.json\` に追記し、\`node scripts/validate.mjs && node scripts/build.mjs\` を実行"
            echo "4. リンク切れがあれば出典URLを差し替える（魚拓も可）"
          } > /tmp/body.md
          EXISTING=$(gh issue list --label triage --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/body.md
          else
            gh label create triage --color FBCA04 --description "人の確認待ち" 2>/dev/null || true
            gh issue create --title "$TITLE" --label triage --body-file /tmp/body.md
          fi
