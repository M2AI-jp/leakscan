<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スキャン結果 — LeakScan (preview)</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/extension/ui/style.css">
<script>
/* Dev-only harness: stubs the chrome.* APIs so the results page can be
   rendered in an ordinary browser with a synthetic report. */

const MASK = {
  'kddi-isp-mail-2026-07':        { service: '○○モバイル ISPメール', company: '○○通信' },
  'skyticket-2026-10':            { service: '○○トラベル',           company: '○○トラベル株式会社' },
  'ryohin-keikaku-muji-2026-10':  { service: '○○ストア アプリ',       company: '○○ストア' },
  'lawson-id-2026-10':            { service: '○○コンビニ ID',        company: '○○リテール' },
  'arcadia-raiden-2026-10':       { service: '○○メール配信',         company: '○○システムズ' },
  'nttsolmare-cmoa-2026-10':      { service: '○○ブックス',           company: '○○デジタル' }
};
function maskEntries(entries) {
  return entries.map(function (e) {
    var m = MASK[e.id];
    if (!m) return e;
    var c = Object.assign({}, e, m);
    c.sources = [{ title: '（表示例のため出典は省略）', url: 'https://leakscan.matsunai.com/' }];
    return c;
  });
}
const FAKE_MATCHES = [
  { id: 'kddi-isp-mail-2026-07', hits: [{ email: 'info@example-mobile.jp', name: '○○モバイル', date: '2026年10月2日', how: 'domain' }] },
  { id: 'skyticket-2026-10',     hits: [{ email: 'noreply@example-travel.jp', name: '○○トラベル', date: '2026年9月18日', how: 'domain' }] },
  { id: 'ryohin-keikaku-muji-2026-10', hits: [{ email: 'info@example-store.jp', name: '○○ストア', date: '2026年10月30日', how: 'domain' }] },
  { id: 'lawson-id-2026-10',     hits: [{ email: 'news@example-cvs.jp', name: '○○コンビニ', date: '2026年10月8日', how: 'domain' }] },
  { id: 'arcadia-raiden-2026-10', hits: [{ email: 'bousai@example-city.lg.jp', name: '○○防災メール', date: '2026年10月13日', how: 'name' }] },
  { id: 'nttsolmare-cmoa-2026-10', hits: [{ email: 'info@example-books.jp', name: '○○ブックス', date: '2026年7月2日', how: 'domain' }] }
];
window.chrome = {
  runtime: {
    getURL: (p) => '/extension/' + p,
    sendMessage: async (msg, cb) => {
      let res;
      if (msg.type === 'LEAKSCAN_GET_VIEW') {
        res = { state: { status: 'done' }, options: {}, db: {},
          report: { generatedAt: Date.now(), dbVersion: '2026.11.06', dbSource: 'remote',
                    accountIndex: 0, includeSpamTrash: false, scanned: 79, queries: 14, matches: FAKE_MATCHES } };
      } else if (msg.type === 'LEAKSCAN_GET_DB') {
        const [meta, entries] = await Promise.all([
          fetch('/extension/data/meta.json').then(r => r.json()),
          fetch('/extension/data/breaches.json').then(r => r.json())
        ]);
        res = { meta, entries: maskEntries(entries) };
      } else { res = { ok: true }; }
      if (cb) cb(res);
      return res;
    },
    onMessage: { addListener() {} }
  },
  tabs: { create(o) { window.open(o.url, '_blank'); } }
};
</script>
</head>
<body class="ext">
<header class="site-header">
  <div class="wrap">
    <span class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 4.5 7v10.2c0 6.3 4.7 10.9 11.5 12.3 6.8-1.4 11.5-6 11.5-12.3V7L16 2.5Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 16.2l3.6 3.6L21.5 13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      LeakScan
    </span>
    <nav class="nav">
      <a href="#services">該当サービス</a>
      <a href="#actions">やること</a>
      <button class="theme-toggle" id="theme" type="button">☾ Dark</button>
    </nav>
  </div>
</header>
<div class="ext-hero"><div class="wrap"><div class="verdict"><div>
  <div class="big" id="headline">読み込み中…</div>
  <div class="verdict-meta" id="meta"></div>
</div></div></div></div>
<section id="actions"><div class="wrap">
  <h2>いま、やること</h2>
  <p class="sec-lead" id="actions-lead">漏洩した項目から機械的に導いた対応リストです（AIによる判断ではありません）。</p>
  <div class="actions" id="action-list"></div>
</div></section>
<section id="services"><div class="wrap">
  <h2>該当したサービス</h2>
  <p class="sec-lead">Gmailに届いているメールの差出人が、漏洩を公表したサービスと一致したものです。</p>
  <div class="entries" id="list"></div>
</div></section>
<section><div class="wrap narrow">
  <div class="cta-row">
    <button class="btn btn-primary" id="rescan" type="button">もう一度スキャンする</button>
    <button class="btn btn-ghost" id="clear" type="button">この結果を削除する</button>
  </div>
</div></section>
<script src="/extension/lib/advice.js"></script>
<script src="/extension/results/results.js"></script>
</body>
</html>
