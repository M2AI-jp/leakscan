<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>情報漏洩チェッカー2026</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/extension/ui/style.css">
<script>
const FAKE = ['kddi-isp-mail-2026-07','skyticket-2026-10','ryohin-keikaku-muji-2026-10','lawson-id-2026-10','arcadia-raiden-2026-10','nttsolmare-cmoa-2026-10'].map(id=>({id,hits:[{email:'x@y.jp',name:'',how:'domain'}]}));

const MASK = {
  'kddi-isp-mail-2026-07':        { service: '○○モバイル ISPメール', company: '○○通信' },
  'skyticket-2026-10':            { service: '○○トラベル',           company: '○○トラベル株式会社' },
  'ryohin-keikaku-muji-2026-10':  { service: '○○ストア アプリ',       company: '○○ストア' },
  'lawson-id-2026-10':            { service: '○○コンビニ ID',        company: '○○リテール' },
  'arcadia-raiden-2026-10':       { service: '○○メール配信',         company: '○○システムズ' },
  'nttsolmare-cmoa-2026-10':      { service: '○○ブックス',           company: '○○デジタル' }
};
function maskEntries(entries) {
  return entries.map(function (e) {
    var m = MASK[e.id];
    if (!m) return e;
    var c = Object.assign({}, e, m);
    c.sources = [{ title: '（表示例のため出典は省略）', url: 'https://leakscan.matsunai.com/' }];
    return c;
  });
}
window.chrome = {
  runtime: {
    getURL: p => '/extension/' + p,
    openOptionsPage(){},
    sendMessage: async (msg, cb) => {
      let res;
      if (msg.type === 'LEAKSCAN_GET_VIEW') res = { state:{status:'done'}, options:{}, db:{count:605,version:'2026.11.08',source:'remote',stale:false},
        report:{generatedAt:Date.now(),dbVersion:'2026.11.08',dbSource:'remote',accountIndex:0,scanned:605,queries:37,matches:FAKE} };
      else if (msg.type === 'LEAKSCAN_GET_DB') res = { meta:await fetch('/extension/data/meta.json').then(r=>r.json()), entries:maskEntries(await fetch('/extension/data/breaches.json').then(r=>r.json())) };
      else res = { ok:true };
      if (cb) cb(res); return res;
    },
    onMessage: { addListener(){} }
  },
  tabs: { create(o){ window.open(o.url,'_blank'); } }
};
</script>
</head>
<body class="popup">
<div class="pad">
  <div class="ptop">
    <span class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 4.5 7v10.2c0 6.3 4.7 10.9 11.5 12.3 6.8-1.4 11.5-6 11.5-12.3V7L16 2.5Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 16.2l3.6 3.6L21.5 13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="bt">情報漏洩チェッカー<i>2026</i></span>
    </span>
    <a class="gear" href="#" id="opts">設定</a>
  </div>

  <div id="err" class="err" hidden></div>
  <h1 id="title">—</h1>
  <p class="sub" id="sub"></p>

  <div id="prog" hidden>
    <div class="bar"><i id="fill"></i></div>
    <p class="sub" id="pnote" style="margin:0"></p>
  </div>

  <div id="buttons"></div>
  <div class="mini" id="top"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="/extension/lib/advice.js"></script>
<script src="/extension/popup/popup.js"></script>
</body>
</html>
